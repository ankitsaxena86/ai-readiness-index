name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (engine + rendering)
        run: npm run test:unit

      - name: Host integration tests
        run: xvfb-run -a npm test

      - name: Package
        run: npx --yes @vscode/vsce package --out ai-readiness-index.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ai-readiness-index.vsix
          if-no-files-found: error
